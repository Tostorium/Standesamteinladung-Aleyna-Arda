  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf6e3 0%, #f0ddb0 50%, #fdf6e3 100%);
      font-family: Georgia, serif;
      padding: 20px;
    }
    h1 {
      color: #b8963e;
      font-size: 1.1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 30px;
      opacity: 0.85;
    }
    .scene {
      width: min(700px, 95vw);
      aspect-ratio: 700 / 500;
      perspective: 1200px;
      cursor: pointer;
    }
    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(120, 90, 30, 0.3), 0 4px 16px rgba(0,0,0,0.12);
    }
    .card.flipped { transform: rotateY(180deg); }
    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      overflow: hidden;
    }
    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .back { transform: rotateY(180deg); }
    .btn {
      margin-top: 28px;
      padding: 13px 40px;
      background: linear-gradient(135deg, #c9a84c, #a87c2a);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 0.92rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 18px rgba(168, 124, 42, 0.45);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 7px 22px rgba(168, 124, 42, 0.55); }
    .btn:active { transform: translateY(0); }
    .hint {
      margin-top: 12px;
      color: #b8963e;
      font-size: 0.76rem;
      opacity: 0.55;
      letter-spacing: 0.08em;
    }
  </style>
